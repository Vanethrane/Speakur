<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Speakur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/site.css" />
  <link rel="stylesheet" href="/assets/word-page.css" />
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/index.html">Speakur</a>
      <nav aria-label="Primary">
        <a class="nav-home" href="/index.html">Home</a>
        <a href="/words/">Words</a>
        <a href="/guides.html">Guides</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>
    <main id="main">
      <p class="eyebrow">404</p>
      <h1>We couldn’t find that page</h1>
      <p class="lede" id="status">Try search, browse guides, or return home.</p>
      <p style="margin-top:1.5rem;">
        <a class="btn" href="/index.html">Back to home</a>
      </p>
      <div id="mount" hidden></div>
    </main>
    <footer>
      <p class="legal">© <span data-year></span> Speakur. <a href="/index.html">Home</a></p>
    </footer>
  </div>
  <script src="/assets/site.js"></script>
  <script src="/assets/word-index.js"></script>
  <script src="/assets/on-demand-word.js"></script>
  <script>
    (async function () {
      const path = location.pathname.replace(/\/+$/, "") || "/";
      const m = path.match(/^\/(medical|food|everyday|science|business|places|names|brands|animals|arts|sports|tech|nature|law|mythology)\/([a-z][a-z'-]*)$/i);
      if (!m) return;

      const category = m[1].toLowerCase();
      const word = m[2].toLowerCase();
      const main = document.getElementById("main");
      const status = document.getElementById("status");
      const mount = document.getElementById("mount");

      document.title = `How to pronounce ${word} · Speakur`;
      main.innerHTML = `
        <p class="eyebrow">Building page</p>
        <h1>${word}</h1>
        <p class="lede" id="status">Building a pronunciation page for “${word}”…</p>
        <div id="mount"></div>
      `;
      const statusEl = document.getElementById("status");
      const mountEl = document.getElementById("mount");

      const result = await SpeakurOnDemand.resolveAndShow({
        rawWord: word,
        preferredCategory: category,
        mount: mountEl,
        statusEl,
        depth: 2,
      });

      if (!result.ok && !result.redirected) {
        document.title = "Not found · Speakur";
        statusEl.insertAdjacentHTML(
          "afterend",
          `<p style="margin-top:1.5rem;"><a class="btn" href="/index.html">Back to home</a></p>`,
        );
      }
    })();
  </script>
</body>
</html>
