  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const word = params.get("q") || "";
      const category = params.get("category") || undefined;
      const statusEl = document.getElementById("status");
      const heading = document.getElementById("heading");
      const mount = document.getElementById("mount");

      if (!word.trim()) {
        heading.textContent = "Missing word";
        statusEl.textContent = "Add a word with ?q=yourword or search from the home page.";
        return;
      }

      heading.textContent = word.toLowerCase().trim();
      const result = await SpeakurOnDemand.resolveAndShow({
        rawWord: word,
        preferredCategory: category,
        mount,
        statusEl,
        depth: 1,
      });

      if (result.ok && result.preview) {
        heading.textContent = result.word;
        document.title = `How to pronounce ${result.word} · Speakur`;
      } else if (!result.ok && !result.redirected) {
        heading.textContent = "Not available";
      }
    })();
  </script>
